appId: com.example.agentdesk.AgentDeskClient
---
- launchApp:
    clearState: false
# Pairing handshake + WebRTC ICE takes a few seconds; the trackpad UI
# only mounts once startMediaTransportIfNeeded fires. Gate the rest of
# the flow on the "Trackpad" hint being visible so screenshots don't
# capture the transient "Connecting" splash.
- extendedWaitUntil:
    visible: "Trackpad"
    timeout: 20000
- tapOn:
    id: "settings-button"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "Light"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Done"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: appearance-light
- tapOn:
    id: "settings-button"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Dark"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Done"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: appearance-dark
- tapOn:
    id: "settings-button"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "System"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Done"
