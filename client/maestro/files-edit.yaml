appId: ${APP_ID}
---
# Switch to Workspace and open README.md into the editor.
- extendedWaitUntil:
    visible: "Workspace"
    timeout: 30000
- tapOn: "Workspace"
# R38: pick a workspace from the picker first (no more auto-select-first).
- extendedWaitUntil:
    visible:
      id: "workspace-picker"
    timeout: 30000
- tapOn:
    id: "workspace-picker"
- tapOn: "agent-desk"
- extendedWaitUntil:
    notVisible: "Loading…"
    timeout: 30000
- tapOn:
    id: "workspace-files-entry-README.md"
- extendedWaitUntil:
    visible:
      id: "workspace-preview-text"
    timeout: 15000
# Edit the text and save it back through the revision-checked .files write.
- tapOn:
    id: "workspace-preview-text"
- inputText: " [edited on device]"
- tapOn:
    id: "workspace-preview-save"
- extendedWaitUntil:
    notVisible: "Saving…"
    timeout: 15000
- takeScreenshot: files-saved
