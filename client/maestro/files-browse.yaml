appId: com.example.agentdesk.AgentDeskClient
---
# Wait for the paired session UI (the surface toggle appears once connected).
- extendedWaitUntil:
    visible: "Workspace"
    timeout: 30000
# Switch to the Workspace surface: opens the .files lane and loads the workspace list.
- tapOn: "Workspace"
# R38 picker: the surface opens on the workspace picker with NOTHING auto-selected. The picker button
# reads "Select workspace" until the user chooses, proving every workspace is reachable (the old
# auto-select-first hid all but the first).
- extendedWaitUntil:
    visible:
      id: "workspace-picker"
    timeout: 30000
- assertVisible: "Select workspace"
- takeScreenshot: files-picker
# Open the picker and choose a known workspace (this repo), then browse its root.
- tapOn:
    id: "workspace-picker"
- tapOn: "agent-desk"
- extendedWaitUntil:
    notVisible: "Loading…"
    timeout: 30000
- takeScreenshot: files-root
# Drill into a directory by its accessibility id (precise, not a coordinate guess).
- tapOn:
    id: "workspace-files-entry-packages"
- extendedWaitUntil:
    notVisible: "Loading…"
    timeout: 15000
- takeScreenshot: files-entered
# Navigate back up to the workspace root via the up control.
- tapOn:
    id: "workspace-files-up"
- extendedWaitUntil:
    notVisible: "Loading…"
    timeout: 15000
- takeScreenshot: files-after-up
# Scope: this flow verifies the R38 picker and directory navigation. Opening a file into the editor
# (read + revision-checked save) is covered by files-edit.yaml, kept as a separate short flow so each
# fits inside the simulator session window (a media-unavailable Debug host idles the QUIC session out
# at ~30s, so long flows flake on the environment, not the code).
