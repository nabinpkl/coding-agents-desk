<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>AgentDesk DOM Mirror</title>
<!-- rrweb's replayer-chrome stylesheet, vendored from rrweb@2.0.0-alpha.4 (same version as
     rrweb.min.js). rrweb's core adds .replayer-wrapper/.replayer-mouse/.replayer-mouse-tail
     classnames and sets the cursor's left/top inline, but ships their position:absolute in THIS
     file, not in the JS. Bundling it is required for the bare Replayer; without it the full-size
     mouse-tail canvas sat in normal flow and pushed the page down. -->
<link rel="stylesheet" href="rrweb.min.css" />
<style>
  html, body { margin: 0; height: 100%; background: #fff; }
  #stage { width: 100%; height: 100%; overflow: hidden; position: relative; }
  /* Transparent overlay captures taps (the replayer iframe would otherwise swallow them). */
  #tap-overlay { position: absolute; inset: 0; z-index: 5; background: transparent; }
  /* rrweb renders into an iframe inside .replayer-wrapper; fitReplay() sizes/scales it (ADR-0044).
     .replayer-wrapper's position:absolute-vs-relative etc. come from the vendored rrweb.min.css
     above; here we only add the scale origin. */
  #stage .replayer-wrapper { transform-origin: top left; }
  #stage iframe { border: 0; display: block; }
</style>
</head>
<body>
  <div id="stage"><div id="tap-overlay"></div></div>
  <script src="fflate.min.js"></script>
  <script src="rrweb.min.js"></script>
  <script>
  (function () {
    var FULL_SNAPSHOT = 2;
    var stage = document.getElementById('stage');
    var replayer = null;
    var pending = [];
    // ADR-0043: chunk reassembly buffer, keyed by cid. A compressed batch too large for one line is
    // split into total parts; hold them until all arrive, then concat and inflate.
    var chunks = {};
    // ADR-0044 Tier B: CDP high-fidelity keyframes arrive as a self-contained masked HTML doc and
    // render into this overlay iframe (above the rrweb replayer, below the tap overlay). cdpSize is the
    // page CSS size for tap mapping.
    var cdpFrame = null;
    var cdpSize = null;
    var lastRecordedW = 0; // recorded desktop viewport width (meta.w) -> scale-to-fit basis

    function base64ToBytes(b64) {
      var bin = atob(b64);
      var out = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    // ADR-0043: events ship deflate-compressed + base64 (see worker.js). Inflate here, at the sink;
    // the host and Swift client relay the string opaquely.
    function inflateEvents(b64) {
      return JSON.parse(fflate.strFromU8(fflate.unzlibSync(base64ToBytes(b64))));
    }
    function inflateStr(b64) {
      return fflate.strFromU8(fflate.unzlibSync(base64ToBytes(b64)));
    }

    // ADR-0043 chunk reassembly, shared by the events and CDP paths. Returns the full base64 string,
    // or null while still waiting for parts. Keyed by cid; parts placed by seq so a dup/reorder on the
    // (reliable, ordered) .dom lane still can't corrupt the concatenation.
    function reassemble(batch) {
      var b64 = batch.ev || '';
      if (batch.total > 1) {
        var slot = chunks[batch.cid] || (chunks[batch.cid] = { total: batch.total, parts: [], count: 0 });
        if (slot.parts[batch.seq] === undefined) { slot.parts[batch.seq] = b64; slot.count++; }
        if (slot.count < slot.total) return null;
        delete chunks[batch.cid];
        b64 = slot.parts.join('');
      }
      return b64;
    }

    // ADR-0044 Tier A: adopted-stylesheet CSS the isolated recorder read and shipped (see
    // content-isolated.js / worker.js). rrweb rebuilds the replay iframe on each FullSnapshot, wiping
    // anything we injected, so keep the latest CSS and re-inject after every snapshot into a singleton
    // <style id="agentdesk-adopted">.
    var adoptedCss = null;
    function injectAdoptedCss() {
      if (adoptedCss == null || !replayer || !replayer.iframe || !replayer.iframe.contentDocument) return;
      var doc = replayer.iframe.contentDocument;
      var el = doc.getElementById('agentdesk-adopted');
      if (!el) {
        el = doc.createElement('style');
        el.id = 'agentdesk-adopted';
        (doc.head || doc.documentElement).appendChild(el);
      }
      if (el.textContent !== adoptedCss) el.textContent = adoptedCss;
    }

    // ADR-0044 Tier B: render/replace the CDP snapshot. Overlays the rrweb replayer (which keeps
    // running underneath, harmless); the tap overlay stays on top. w/h size the frame for tap mapping.
    function renderCdp(html, w, h) {
      var stageEl = document.getElementById('stage');
      if (!cdpFrame) {
        cdpFrame = document.createElement('iframe');
        cdpFrame.id = 'cdp-frame';
        cdpFrame.setAttribute('sandbox', ''); // no scripts: it's a static, masked snapshot
        cdpFrame.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;z-index:2;';
        stageEl.insertBefore(cdpFrame, document.getElementById('tap-overlay'));
      }
      cdpSize = { w: w || 0, h: h || 0 };
      // The CDP frame is sandbox='' (opaque origin) so we can't measure/reflow it; scale-to-fit by the
      // known recorded width instead. Tap mapping uses cdpSize.w against the displayed (scaled) rect.
      var stageW = stage.clientWidth || 1;
      if (w && w > stageW) {
        cdpFrame.style.width = w + 'px';
        cdpFrame.style.height = (h || stage.clientHeight) + 'px';
        cdpFrame.style.transformOrigin = 'top left';
        cdpFrame.style.transform = 'scale(' + (stageW / w) + ')';
      } else {
        cdpFrame.style.width = '100%';
        cdpFrame.style.height = '100%';
        cdpFrame.style.transform = 'none';
      }
      cdpFrame.srcdoc = html;
    }
    function removeCdp() {
      if (cdpFrame) { cdpFrame.remove(); cdpFrame = null; }
      cdpSize = null;
    }

    function haveSnapshot(evts) {
      for (var i = 0; i < evts.length; i++) if (evts[i].type === FULL_SNAPSHOT) return true;
      return false;
    }

    function applyEvent(e) {
      if (!replayer) {
        pending.push(e);
        if (haveSnapshot(pending)) {
          // mouseTail on (rrweb default): the recorded cursor (.replayer-mouse) and its move-trail
          // (.replayer-mouse-tail) now draw as absolute overlays, positioned by the vendored
          // rrweb.min.css, so they no longer take flow space or push the page.
          replayer = new rrweb.Replayer(pending, { liveMode: true, root: stage });
          replayer.startLive(pending[0].timestamp);
          pending = [];
        }
      } else {
        replayer.addEvent(e);
      }
    }

    // ADR-0044: fit the desktop-captured page to the phone. rrweb does NOT reflow -- it replays the
    // page faithfully at the RECORDED desktop width (meta.w, the Mac viewport), so the only lever is a
    // transform scale (this is what rrweb-player does too). Scale the whole page down to the phone
    // width: exact desktop layout, whole width visible, text smaller (pinch-zoom is a future add).
    // Tap-back (ADR-0040) stays exact because getBoundingClientRect reflects the scaled rect.
    var fitScale = 1;
    function fitReplay() {
      if (!replayer || !replayer.iframe) return;
      var iframe = replayer.iframe;
      var wrapper = iframe.parentNode;
      if (!wrapper) return;
      var doc = iframe.contentDocument;
      var recordedW = lastRecordedW
        || parseInt(iframe.getAttribute('width'), 10)
        || (doc && doc.documentElement && doc.documentElement.scrollWidth)
        || 0;
      if (!recordedW) return;
      var stageW = stage.clientWidth || 1;
      fitScale = Math.min(1, stageW / recordedW);
      wrapper.style.transformOrigin = 'top left';
      wrapper.style.transform = 'scale(' + fitScale + ')';
    }

    // Native -> webview: one batch { t, tb, co, ev:[...], meta }. Feed its rrweb events, then
    // report a probe summary of the reconstructed DOM so the autonomous harness can assert the
    // mirror worked (visible text is masked, so the probe keys on a data-attribute marker +
    // node count, not on page text).
    window.__domMirrorDeliver = function (rawJSON) {
      var batch;
      try { batch = typeof rawJSON === 'string' ? JSON.parse(rawJSON) : rawJSON; }
      catch (e) { return; }
      if (!batch) return;
      if (batch.meta && batch.meta.w) lastRecordedW = batch.meta.w; // recorded desktop width for fit
      // ADR-0043/0044: a keyframe (co:true) supersedes any incomplete chunk set, for events AND CDP.
      // Clearing here bounds the chunks map (no slot outlives the next keyframe) and makes a cid reused
      // after an MV3 service-worker restart harmless (part 0's co:true clears the old slot first).
      if (batch.co) chunks = {};
      // ADR-0044 Tier B: CDP high-fidelity keyframe (self-contained masked HTML) or a turn-off signal.
      if (batch.k === 'cdp') {
        if (batch.enc !== 'deflate-b64') return;
        var cb64 = reassemble(batch);
        if (cb64 == null) return;
        var chtml;
        try { chtml = inflateStr(cb64); } catch (e) { return; }
        renderCdp(chtml, batch.w, batch.h);
        scheduleProbe();
        return;
      }
      if (batch.k === 'cdp-off') { removeCdp(); return; }
      // ADR-0044 Tier A: a css-only line carries adopted-stylesheet CSS (no events). Stash + inject.
      if (batch.cssz) {
        try { adoptedCss = inflateStr(batch.cssz); injectAdoptedCss(); } catch (e) {}
        return;
      }
      var ev;
      if (batch.enc === 'deflate-b64') {
        var b64 = reassemble(batch);
        if (b64 == null) return; // waiting for the remaining parts
        try { ev = inflateEvents(b64); }
        catch (e) { return; } // corrupt/partial batch: drop it, the next keyframe recovers
      } else {
        // Defensive: an uncompressed batch (array ev) still replays.
        ev = (batch && batch.ev) || [];
      }
      for (var i = 0; i < ev.length; i++) applyEvent(ev[i]);
      injectAdoptedCss(); // re-apply after a (possibly rebuilt) snapshot
      scheduleProbe();
    };

    // rrweb liveMode renders the FullSnapshot on a timed tick, not synchronously, so probing right
    // after addEvent would read an unrendered (empty) iframe. Debounce: probe ~700ms after the last
    // batch, by which point the replayer has reconstructed the DOM.
    var probeTimer = null;
    function scheduleProbe() {
      if (probeTimer) clearTimeout(probeTimer);
      probeTimer = setTimeout(postProbe, 700);
    }

    function postProbe() {
      // In CDP mode probe the overlay frame; otherwise the rrweb replayer iframe.
      var doc = null;
      if (cdpFrame && cdpFrame.contentDocument) doc = cdpFrame.contentDocument;
      else if (replayer && replayer.iframe && replayer.iframe.contentDocument) doc = replayer.iframe.contentDocument;
      if (!doc) return;
      injectAdoptedCss(); // the snapshot rebuild is async; ensure the style survives the settled DOM
      fitReplay();        // fit the (now settled) page to the phone: reflow, else scale
      var markerEl = doc.querySelector('[data-agentdesk-fixture]');
      var marker = markerEl ? markerEl.getAttribute('data-agentdesk-fixture') : '';
      var nodes = doc.querySelectorAll('*').length;
      try {
        window.webkit.messageHandlers.domMirror.postMessage({ kind: 'probe', marker: marker, nodes: nodes });
      } catch (e) {}
    }

    // ADR-0040: capture a tap on the overlay, map it from the displayed (scaled) mirror back to the
    // page's own CSS-pixel coordinate space, and post it to native to route back to Chrome. rrweb
    // sets the replayer iframe's width/height attributes to the recorded page size, so the scale is
    // recordedSize / displayedSize.
    document.getElementById('tap-overlay').addEventListener('click', function (e) {
      // Map against whichever surface is showing: the CDP overlay (Tier B) or the rrweb iframe.
      var frame = cdpFrame || (replayer && replayer.iframe);
      if (!frame) return;
      var rect = frame.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return;
      var pageW = (cdpFrame && cdpSize && cdpSize.w) || parseInt(frame.getAttribute('width'), 10) || rect.width;
      var pageH = (cdpFrame && cdpSize && cdpSize.h) || parseInt(frame.getAttribute('height'), 10) || rect.height;
      var x = (e.clientX - rect.left) * (pageW / rect.width);
      var y = (e.clientY - rect.top) * (pageH / rect.height);
      if (x < 0 || y < 0 || x > pageW || y > pageH) return; // tap landed outside the mirrored page
      try { window.webkit.messageHandlers.domMirror.postMessage({ kind: 'tap', x: x, y: y }); } catch (err) {}
    });

    // Re-fit on viewport change (orientation / split view).
    window.addEventListener('resize', function () { try { fitReplay(); } catch (e) {} });

    window.__domMirrorBridge = { destroy: function () { try { removeCdp(); replayer && replayer.pause(); } catch (e) {} } };
  })();
  </script>
</body>
</html>
