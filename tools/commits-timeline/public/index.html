<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Commit timeline</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161819'/%3E%3Cpath d='M12 6v20' stroke='%23555b5e' stroke-width='2'/%3E%3Ccircle cx='12' cy='10' r='3' fill='%236fbf8f'/%3E%3Ccircle cx='12' cy='16' r='3' fill='%23d8846f'/%3E%3Ccircle cx='12' cy='22' r='3' fill='%237fa8d8'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip" href="#timeline">Skip to the timeline</a>

    <header class="mast">
      <div class="mast-id">
        <h1 id="repo">Commit timeline</h1>
        <p class="mast-sub" id="range">reading history…</p>
      </div>
      <dl class="figures" id="figures"></dl>
      <button class="icon-button" id="theme" type="button" aria-label="Switch theme"></button>
    </header>

    <figure class="chart is-day" id="chart-figure">
      <figcaption class="chart-head">
        <span class="chart-label" id="chart-label">Commits per day</span>
        <div class="chart-controls">
          <button class="link-button" id="clear-range" type="button" hidden>Show all commits</button>
          <div class="segmented" id="granularity" role="group" aria-label="Chart granularity">
            <button type="button" data-unit="day" aria-pressed="true">Day</button>
            <button type="button" data-unit="week" aria-pressed="false">Week</button>
            <button type="button" data-unit="calendar" aria-pressed="false">Calendar</button>
          </div>
        </div>
      </figcaption>
      <div class="chart-wrap" id="chart-wrap">
        <div class="chart-bars" id="chart"></div>
        <div class="calendar-layout" id="calendar-layout" hidden>
          <div class="calendar" id="calendar"></div>
          <div class="calendar-facts" id="calendar-facts"></div>
        </div>
        <output class="chart-readout" id="chart-readout" hidden></output>
      </div>
      <div class="chart-months" id="chart-months" aria-hidden="true"></div>
    </figure>

    <section class="controls" id="controls" aria-label="Filters">
      <div class="search">
        <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5" />
          <path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
        <input
          id="q"
          type="search"
          placeholder="Search subject, message, sha"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          aria-label="Search commits"
        />
        <kbd>/</kbd>
      </div>
      <div class="kinds" id="kinds" role="group" aria-label="Filter by kind"></div>
    </section>

    <div class="status" id="status" role="status" aria-live="polite"></div>

    <main id="timeline" tabindex="-1"></main>
    <div class="sentinel" id="sentinel" hidden></div>

    <footer class="foot" id="foot"></footer>
    <span class="visually-hidden" id="flash" role="status"></span>

    <script type="module" src="/app.js"></script>
  </body>
</html>
