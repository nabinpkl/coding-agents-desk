<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AgentDesk Annotator</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<main>
  <header>
    <strong>Web Annotator</strong>
    <span id="status" class="status" role="status"></span>
  </header>
  <div class="actions">
    <button id="toggle" type="button">Annotate this page</button>
    <button id="copy" type="button">Copy open items as Markdown</button>
  </div>
  <div id="auth" class="auth"></div>
  <details>
    <summary>Server</summary>
    <form id="server-form">
      <input id="server-url" type="url" required aria-label="Server URL" placeholder="https://annotator.example.com">
      <button type="submit">Save</button>
    </form>
  </details>
  <p id="error" class="error" role="alert"></p>
  <footer id="build"></footer>
</main>
<script src="popup.js"></script>
</body>
</html>
