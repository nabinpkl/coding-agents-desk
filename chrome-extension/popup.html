<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  body { width: 248px; margin: 0; font: 13px/1.4 -apple-system, system-ui, sans-serif; color: #1d1d1f; }
  .wrap { padding: 14px 16px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #c7c7cc; flex: none; }
  .dot.on { background: #d00000; box-shadow: 0 0 0 3px rgba(208, 0, 0, .15); }
  .status { font-weight: 600; }
  .sub { color: #6e6e73; margin: 5px 0 12px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
  button.start { background: #d00000; color: #fff; }
  button.stop { background: #e8e8ed; color: #1d1d1f; }
  button:disabled { background: #e8e8ed; color: #aeaeb2; cursor: default; }
  .hint { color: #8e8e93; font-size: 11px; margin-top: 8px; text-align: center; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row"><span class="dot" id="dot"></span><span class="status" id="status">Checking…</span></div>
    <div class="sub" id="sub"></div>
    <button id="toggle" disabled>…</button>
    <div class="hint">Shortcut: Alt+Shift+M</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
