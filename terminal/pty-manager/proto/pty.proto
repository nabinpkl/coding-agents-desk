syntax = "proto3";

package pty.v1;

message Envelope {
  uint32 protocol_version = 1;
  uint64 request_id = 2;
  string session_name = 3;

  oneof payload {
    Hello hello = 10;
    CreateOrAttach create_or_attach = 11;
    Attached attached = 12;
    Detach detach = 13;
    Input input = 14;
    Output output = 15;
    ListSessions list_sessions = 16;
    SessionList session_list = 17;
    KillSession kill_session = 18;
    SessionExited session_exited = 19;
    Error error = 20;
    SubscribeSessions subscribe_sessions = 21;
    SessionSnapshot session_snapshot = 22;
    Resize resize = 23;
    CloseClient close_client = 24;
    ClientDetached client_detached = 25;
  }
}

message Hello {
  string client_name = 1;
}

message CreateOrAttach {
  oneof launch {
    ShellLaunch shell_launch = 1;
    CommandLaunch command_launch = 2;
  }
  uint32 columns = 3;
  uint32 rows = 4;
  bool create_if_missing = 5;
  string client_title = 6;
  SessionLifetime lifetime = 7;
}

message ShellLaunch {
  string cwd = 1;
  string shell = 2;
}

message CommandLaunch {
  string cwd = 1;
  string executable = 2;
  repeated string arguments = 3;
}

message Attached {
  uint32 pid = 1;
  string cwd = 2;
  string shell = 3;
  uint32 client_count = 4;
  uint64 client_id = 5;
}

message Detach {}

message Input {
  bytes data = 1;
}

message Resize {
  uint32 columns = 1;
  uint32 rows = 2;
}

message Output {
  bytes data = 1;
}

message ListSessions {}

message SubscribeSessions {}

message SessionList {
  repeated SessionSummary sessions = 1;
}

message SessionSnapshot {
  repeated SessionSummary sessions = 1;
}

message SessionSummary {
  string name = 1;
  string cwd = 2;
  string shell = 3;
  uint32 pid = 4;
  SessionState state = 5;
  repeated ClientSummary clients = 6;
  SessionLifetime lifetime = 7;
}

message ClientSummary {
  uint64 id = 1;
  string title = 2;
}

enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_RUNNING = 1;
  SESSION_STATE_EXITED = 2;
}

enum SessionLifetime {
  SESSION_LIFETIME_UNSPECIFIED = 0;
  SESSION_LIFETIME_PERSISTENT = 1;
  SESSION_LIFETIME_LEASED = 2;
}

message KillSession {}

message CloseClient {
  uint64 client_id = 1;
}

message ClientDetached {
  uint64 client_id = 1;
}

message SessionExited {
  int32 status = 1;
}

message Error {
  string message = 1;
}
