syntax = "proto3";

package pty.vault.v1;

message VaultRequest {
  uint32 protocol_version = 1;
  uint64 request_id = 2;

  oneof payload {
    CreateSession create_session = 10;
    ListSessions list_sessions = 11;
    LeaseSession lease_session = 12;
    ResizeSession resize_session = 13;
    KillSession kill_session = 14;
    QueryExitStatus query_exit_status = 15;
    BeginHandover begin_handover = 16;
    ImportSession import_session = 17;
  }
}

message VaultResponse {
  uint32 protocol_version = 1;
  uint64 request_id = 2;
  string error = 3;

  oneof payload {
    SessionLease session_lease = 10;
    SessionList session_list = 11;
    Acknowledged acknowledged = 12;
    ExitStatus exit_status = 13;
  }
}

message CreateSession {
  string name = 1;
  uint32 columns = 2;
  uint32 rows = 3;
  reserved 4;  // was int32 lifetime

  oneof launch {
    ShellLaunch shell_launch = 10;
    CommandLaunch command_launch = 11;
  }
}

message ShellLaunch {
  string cwd = 1;
  string shell = 2;
}

message CommandLaunch {
  string cwd = 1;
  string executable = 2;
  repeated string arguments = 3;
}

message ListSessions {}

message LeaseSession {
  string name = 1;
  uint64 generation = 2;
}

message ResizeSession {
  string name = 1;
  uint64 generation = 2;
  uint32 columns = 3;
  uint32 rows = 4;
}

message KillSession {
  string name = 1;
  uint64 generation = 2;
}

message QueryExitStatus {
  string name = 1;
  uint64 generation = 2;
  bool acknowledge = 3;
}

message BeginHandover {
  string transfer_socket_path = 1;
}

message ImportSession {
  Session session = 1;
}

message SessionLease {
  Session session = 1;
}

message SessionList {
  repeated Session sessions = 1;
}

message Session {
  string name = 1;
  string cwd = 2;
  string shell = 3;
  uint32 pid = 4;
  int32 process_group = 5;
  uint64 generation = 6;
  uint64 started_at_unix_milliseconds = 7;
  uint32 columns = 8;
  uint32 rows = 9;
  reserved 10;  // was int32 lifetime
  bool exited = 11;
  int32 exit_status = 12;
}

message Acknowledged {}

message ExitStatus {
  bool exited = 1;
  int32 status = 2;
}

message VaultHandoverManifest {
  uint32 protocol_version = 1;
  uint64 vault_generation = 2;
  uint64 next_session_generation = 3;
  uint32 session_count = 4;
  uint64 checksum = 5;
  repeated Session sessions = 6;
}

message VaultHandoverDescriptor {
  uint32 index = 1;
  string session_name = 2;
  uint64 session_generation = 3;
}

message VaultHandoverCommit {
  uint64 vault_generation = 1;
  uint64 checksum = 2;
  repeated Session sessions = 3;
}

message HandoverPhase {
  enum Phase {
    UNSPECIFIED = 0;
    READY = 1;
    ACTIVE = 3;
  }
  Phase phase = 1;
}
