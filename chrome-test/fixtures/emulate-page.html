<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- width=device-width is what makes device emulation observable: under Chrome mobile emulation the
     layout viewport becomes the emulated device width (390), whereas a page with NO viewport meta
     falls back to the legacy 980px mobile layout. So this fixture's window.innerWidth (shipped as the
     batch meta.w) is ~390 when emulated and the real window width otherwise. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:" />
<title>AgentDesk DOM Mirror emulate fixture</title>
<style>
  body { font: 16px/1.6 -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; }
</style>
</head>
<body>
  <main data-agentdesk-fixture="dommirror-emulate-ok">
    <h1>emulate fixture</h1>
    <p>Its viewport meta declares width=device-width, so device emulation changes window.innerWidth.</p>
  </main>
</body>
</html>
