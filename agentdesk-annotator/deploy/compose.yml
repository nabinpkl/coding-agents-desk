# Production stack on oracle. Run from deploy/: docker compose up -d --build
# Values come from deploy/.env (mode 0600, never committed); see .env.example.
# The server publishes no host port: only cloudflared reaches it, over the
# compose network, and every request still needs an Access-signed JWT.
# The project name below names the containers and the data volume. A stack
# first deployed under another name keeps it, and its data, by setting
# COMPOSE_PROJECT_NAME in deploy/.env, which takes precedence over it.
name: agentdesk-annotator

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      ANNOTATOR_HOST: 0.0.0.0
      ANNOTATOR_PORT: "3847"
      ANNOTATOR_DATA_DIR: /data
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:?set in deploy/.env}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:?set in deploy/.env}
      ANNOTATOR_ALLOWED_EMAILS: ${ANNOTATOR_ALLOWED_EMAILS:?set in deploy/.env}
      ANNOTATOR_ALLOWED_SERVICE_TOKENS: ${ANNOTATOR_ALLOWED_SERVICE_TOKENS:-}
      # The agent hub, for Send. The Access service token is minted by the hub's own Access app,
      # not this one; see deploy/cloudflare.md for what has to exist before this starts.
      HUB_URL: ${HUB_URL:?set in deploy/.env}
      HUB_ACCESS_CLIENT_ID: ${HUB_ACCESS_CLIENT_ID:?set in deploy/.env}
      HUB_ACCESS_CLIENT_SECRET: ${HUB_ACCESS_CLIENT_SECRET:?set in deploy/.env}
    volumes:
      - annotator-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3847/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  tunnel:
    image: cloudflare/cloudflared:2026.9.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set in deploy/.env}
    depends_on:
      server:
        condition: service_healthy

volumes:
  annotator-data:
