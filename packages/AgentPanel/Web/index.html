<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The scale is PINNED, which is what makes this an app panel on the phone rather than a page.

      Three symptoms, one cause. Left open, WebKit gives the panel a zoom range of its own on top
      of a document that already fills the viewport exactly: `styles.css` locks html/body/#root to
      100% height with `overflow: hidden`, so nothing here can scroll or spill sideways on its own.
      Every horizontal pan the phone offers therefore comes from a scale other than 1, and so does
      every "it came up too big". The webview also starts its first navigation at `frame: .zero`
      (WebPanelWebViewController loads in `init`, before the container adds it), so `device-width`
      resolves against no width at all and the real bounds arrive afterwards -- with the range open,
      WebKit is free to settle that at a scale instead of a relayout. Pinned, it has no choice.

      macOS ignores the viewport meta entirely, so this costs the Mac panel nothing. Pinch is not
      the panel's text-size affordance either: the feed's own font-size control drives the
      `--agent-panel-fs-*` tokens, which resize text without resizing the chrome around it.

      The other two iOS-embedded webviews in this repo already do this -- WorkspaceIDE with
      `user-scalable=no`, BrowserProjection with `minimum-scale=1, maximum-scale=1`. This panel
      predates the phone (ADR-0095, ADR-0096 put it there) and never got either. Both spellings are
      here because they are not honoured by the same engines.

      `viewport-fit=cover` hands the panel the edges the shell leaves it, and the page pays for them
      in padding rather than letting WebKit hold them back. Without it WebKit insets the layout
      viewport by the webview's own safe area and paints what it reserved in `underPageBackgroundColor`
      -- pure black in dark mode, against a card at oklch(0.205), so the composer sat on a black band
      above the home indicator. With it, the composer's own background reaches the physical edge and
      the inset moves into `env(safe-area-inset-*)`, which AgentPanelApp and the project drawer spend
      as padding: bottom for the home indicator, left and right for the landscape notch.

      Only the edges the shell actually gives up appear there. The container pins the surface to the
      safe-area top (PairingViewController+AgentSurface), so `env(safe-area-inset-top)` is zero and
      the header needs nothing -- covering does not put it under the status bar.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Agent Feed</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!--
      The panel's background, inline, so the FIRST paint is already the right colour.

      `styles.css` is imported from `main.tsx`, so it is not a stylesheet the document knows
      about at parse time: in dev it arrives as a JS-injected <style> only after the module
      graph has come over the network -- from the tailnet, on the phone. Until then the
      document has no background and paints white. That is the flash. The bundled build turns
      the import into a <link> and closes most of the gap, but not the part before it loads,
      and a `loadPanel` switch to the dev origin re-opens it on a panel that is already on
      screen.

      These two values are the light and dark `--background` from src/app/styles.css, which
      `body` applies via `bg-background`. They are a second copy on purpose -- the first paint
      cannot wait for the first copy -- and criticalBackground.test.ts fails if they drift.
    -->
    <style>
      /* Declared here, and therefore ahead of every layer Tailwind declares later, so the real
         stylesheet outranks this one the moment it lands. A stale copy can then only cost a
         brief wrong-coloured frame; it can never hold the wrong background on a loaded panel. */
      @layer critical {
        :root {
          color-scheme: light dark;
        }
        html,
        body {
          margin: 0;
          background: oklch(1 0 0);
        }
        @media (prefers-color-scheme: dark) {
          html,
          body {
            background: oklch(0.22 0 0);
          }
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
