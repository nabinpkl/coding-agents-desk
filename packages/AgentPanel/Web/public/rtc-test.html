<!doctype html>
<!--
  Throwaway experiment, not part of the panel: the audio channel as a WebRTC audio track
  (`POST /api/audio/rtc-test`), to learn whether a phone keeps playing it on a locked screen and
  how far behind it runs. Receive only: no microphone is asked for.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WebRTC Audio Test</title>
    <style>
      :root {
        --ground: #f4f5f7;
        --ink: #14161a;
        --muted: #5b6270;
        --line: #d5d8de;
        --accent: #2f6fde;
        --accent-ink: #ffffff;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #14161a;
          --ink: #eceef2;
          --muted: #9aa1ad;
          --line: #2c3038;
          --accent: #6b9cf2;
          --accent-ink: #0d1117;
        }
      }
      body {
        margin: 0;
        background: var(--ground);
        color: var(--ink);
        font: 16px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
      }
      main {
        max-width: 460px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      h1 {
        margin: 0;
        font-size: 24px;
      }
      dl {
        margin: 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 12px;
        font-variant-numeric: tabular-nums;
      }
      dt,
      .label {
        color: var(--muted);
      }
      dd {
        margin: 0;
      }
      .big {
        font-size: 32px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      button {
        font: inherit;
        font-weight: 600;
        padding: 14px 18px;
        border-radius: 12px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: var(--accent-ink);
        touch-action: manipulation;
      }
      button:disabled {
        opacity: 0.5;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      pre {
        margin: 0;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font: 12px/1.5 ui-monospace, Menlo, monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 40vh;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>WebRTC Audio Test</h1>
      <button id="start" type="button">Start</button>
      <div>
        <div class="label">Jitter buffer (how far behind)</div>
        <div class="big" id="delay">-</div>
      </div>
      <dl id="live"></dl>
      <pre id="log"></pre>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const t0 = performance.now();
      const logBox = document.getElementById("log");
      const id = crypto.randomUUID().slice(0, 8);
      const unsent = [];
      const log = (line) => {
        const stamped = `${((performance.now() - t0) / 1000).toFixed(1).padStart(6)}s  ${line}`;
        logBox.textContent = `${stamped}\n` + logBox.textContent;
        unsent.push(stamped.trim());
      };
      const audio = document.createElement("audio");
      audio.autoplay = true;
      document.body.append(audio);
      for (const name of ["playing", "pause", "waiting", "stalled", "ended", "error"]) {
        audio.addEventListener(name, () => log(`audio ${name}`));
      }
      window.heard = [];
      const TARGET_MS = Number(params.get("target") ?? 500);
      function withAudioNack(sdp) {
        const lines = sdp.split("\r\n");
        const out = [];
        for (const line of lines) {
          out.push(line);
          const match = /^a=rtpmap:(\d+) /.exec(line);
          if (match && !lines.includes(`a=rtcp-fb:${match[1]} nack`)) out.push(`a=rtcp-fb:${match[1]} nack`);
        }
        return out.join("\r\n");
      }
      let peer = null;

      document.getElementById("start").addEventListener("click", async (event) => {
        event.currentTarget.disabled = true;
        // Started inside the tap, so iOS lets it play once the track arrives.
        audio.play().catch(() => {});
        peer = new RTCPeerConnection();
        const transceiver = peer.addTransceiver("audio", { direction: "recvonly" });
        // Room for a resent packet to arrive before its turn to play: longer than a burst of loss.
        if ("jitterBufferTarget" in transceiver.receiver) {
          transceiver.receiver.jitterBufferTarget = TARGET_MS;
          log(`jitter buffer target ${TARGET_MS} ms`);
        } else log("no jitterBufferTarget here, so the buffer stays the browser's choice");
        peer.addEventListener("connectionstatechange", () => log(`connection ${peer.connectionState}`));
        peer.addEventListener("track", (track) => {
          log("track arrived");
          audio.srcObject = track.streams[0] ?? new MediaStream([track.track]);
          audio.play().then(
            () => {
              log("play() resolved");
              if ("mediaSession" in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({ title: "WebRTC Audio Test", artist: "Agent Desk" });
              }
            },
            (error) => log(`play() refused: ${error.message}`),
          );
          if (params.get("probe") === "1") probe(audio.srcObject);
        });
        try {
          const offer = await peer.createOffer();
          // Browsers do not offer NACK for audio; adding it lets the phone ask for a missed packet again.
          await peer.setLocalDescription({ type: "offer", sdp: params.get("nack") === "0" ? offer.sdp : withAudioNack(offer.sdp) });
          if (peer.iceGatheringState !== "complete") {
            await new Promise((done) => {
              const check = () => peer.iceGatheringState === "complete" && done();
              peer.addEventListener("icegatheringstatechange", check);
              setTimeout(done, 3000);
            });
          }
          const response = await fetch(`/api/audio/rtc-test?noise=${params.get("noise") ?? 3}`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ type: "offer", sdp: peer.localDescription.sdp }),
          });
          log(`answer ${response.status}`);
          await peer.setRemoteDescription(await response.json());
        } catch (error) {
          log(`failed: ${error.message}`);
        }
      });

      // Mac only (?probe=1): a sound detector on the received track, for measuring the delay.
      function probe(stream) {
        const context = new AudioContext();
        const analyser = context.createAnalyser();
        analyser.fftSize = 512;
        context.createMediaStreamSource(stream).connect(analyser);
        const data = new Float32Array(analyser.fftSize);
        let quietSince = performance.now();
        setInterval(() => {
          analyser.getFloatTimeDomainData(data);
          const rms = Math.sqrt(data.reduce((sum, v) => sum + v * v, 0) / data.length);
          if (rms < 0.01) quietSince ??= performance.now();
          else {
            if (quietSince !== null && performance.now() - quietSince > 500) window.heard.push(Date.now());
            quietSince = null;
          }
        }, 5);
      }

      // Polled once a second: the jitter buffer's delay is only in getStats, which nothing announces.
      const delayBox = document.getElementById("delay");
      const live = document.getElementById("live");
      let last = null;
      const row = (name, value) => {
        const dt = document.createElement("dt");
        dt.textContent = name;
        const dd = document.createElement("dd");
        dd.textContent = value;
        live.append(dt, dd);
      };
      setInterval(async () => {
        if (!peer) return;
        const stats = await peer.getStats();
        let inbound = null;
        stats.forEach((report) => {
          if (report.type === "inbound-rtp" && report.kind === "audio") inbound = report;
        });
        live.replaceChildren();
        row("Connection", peer.connectionState);
        row("Playing", audio.paused ? "no" : "yes");
        if (!inbound) return;
        if (last && inbound.jitterBufferEmittedCount > last.jitterBufferEmittedCount) {
          const delay =
            (inbound.jitterBufferDelay - last.jitterBufferDelay) /
            (inbound.jitterBufferEmittedCount - last.jitterBufferEmittedCount);
          delayBox.textContent = `${delay.toFixed(2)} s`;
        }
        last = inbound;
        row("Packets", String(inbound.packetsReceived));
        row("Lost", String(inbound.packetsLost));
        row("Asked again (NACK)", String(inbound.nackCount ?? "-"));
        row("Concealed samples", String(inbound.concealedSamples));
        row("Network jitter", `${((inbound.jitter ?? 0) * 1000).toFixed(0)} ms`);
        // Sent to the audio process too, so the numbers can be read there, not off this screen.
        fetch("/api/audio/test-reports", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            page: id,
            connection: peer.connectionState,
            playing: !audio.paused,
            visibility: document.visibilityState,
            jitterBufferS: delayBox.textContent,
            packets: inbound.packetsReceived,
            lost: inbound.packetsLost,
            nacks: inbound.nackCount,
            target: TARGET_MS,
            concealed: inbound.concealedSamples,
            jitterMs: Math.round((inbound.jitter ?? 0) * 1000),
            log: unsent.splice(0),
          }),
          keepalive: true,
        }).catch(() => {});
      }, 1000);
    </script>
  </body>
</html>
