  keep it playing on a locked screen? Noise (white, pink or brown, picked on the page with the agent's

  rendered to samples and mixed into the same graph: iOS's own voice is a separate output, and iOS

            pending = joined;
            for (;;) {
              if (pending.length < 4) break;
              const view = new DataView(pending.buffer, pending.byteOffset, pending.byteLength);
              const headerLength = view.getUint32(0, true);
              if (pending.length < 8 + headerLength) break;
              const pcmLength = view.getUint32(4 + headerLength, true);
              const end = 8 + headerLength + pcmLength;
              if (pending.length < end) break;
              const header = JSON.parse(new TextDecoder().decode(pending.subarray(4, 4 + headerLength)));
              if (pcmLength > 0) {
                const samples = new Float32Array(pending.slice(8 + headerLength, end).buffer);
                playPushed(header, samples, receivedAt);
              } else if (typeof header.stop === "number") {
                stopPushed(header.stop);
              }
              pending = pending.slice(end);
            }
          }
        } catch (error) {
          return stop.signal.aborted ? stop.signal.reason.message : `listening failed: ${error.message}`;
        } finally {
          clearInterval(watchdog);
        }
      }

      /**
       * Listens to the Mac for as long as the page runs, connecting again whenever the stream drops: the
       * Mac's speech server or the dev server restarting, or the network going away for a while.
       * Speech already scheduled plays on; what the Mac pushed while nothing was connected is not heard.
       */
      async function listenToMac() {
        let tries = 0;
        for (;;) {
          const connectsBefore = macStream.connects;
          const why = await readMacStream();
          if (macStream.connects !== connectsBefore) tries = 0;
          macStream.drops += 1;
          const wait = RECONNECT_MS[Math.min(tries, RECONNECT_MS.length - 1)];
          tries += 1;
          macStream.state = `${why}; reconnecting in ${wait / 1000} s`;
          log(macStream.state);
          await new Promise((resolve) => setTimeout(resolve, wait));
          macStream.state = `reconnecting, try ${tries}`;
        }
      }

      /**
       * The Mac's control stream, beside the audio one: a stop arrives here at once, where on the audio
       * stream it would wait behind every byte of speech already on its way. Reconnects as the audio
       * stream does, and drops a stalled connection the same way.
       */
      async function watchMac() {
        for (let tries = 0; ; tries += 1) {
          const stop = new AbortController();
          let heardAt = Date.now();
          // A timer, justified: a stalled connection raises nothing; only the missing keepalives tell.
          const watchdog = setInterval(() => {
            if (Date.now() - heardAt > MAC_SILENT_MS) stop.abort(new Error("the control stream went quiet"));
          }, 2000);
          try {
            const response = await fetch(`/api/audio/kitten-events?at=${Date.now()}`, { cache: "no-store", signal: stop.signal });
            if (response.ok) {
              tries = 0;
              log("control stream open");
              const reader = response.body.getReader();
              const decoder = new TextDecoder();
              let pending = "";
              for (;;) {
                const { value, done } = await reader.read();
                if (done) break;
                heardAt = Date.now();
                pending += decoder.decode(value, { stream: true });
                const lines = pending.split("\n");
                pending = lines.pop() ?? "";
                for (const line of lines) {
                  if (!line.trim()) continue;
                  const event = JSON.parse(line);
                  if (typeof event.stop === "number") stopPushed(event.stop);
                }
              }
            }
          } catch (error) {
            log(`control stream: ${stop.signal.aborted ? stop.signal.reason.message : error.message}`);
          } finally {
            clearInterval(watchdog);
          }
          await new Promise((resolve) => setTimeout(resolve, RECONNECT_MS[Math.min(tries, RECONNECT_MS.length - 1)]));
        }
      }

      /**
       * Push mode: hands `text` to the Mac the way an agent does, `POST /api/audio/speak`, and hears it
       * come back down the push stream like any agent's message.
       */
      async function speakOnMac(text) {
        state.spoken += 1;
        const response = await fetch("/api/audio/speak", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ text }),
        }).catch((error) => ({ ok: false, status: 0, text: async () => error.message }));
        const body = await response.text();
        if (!response.ok) state.errors += 1;
        log(`speak: ${response.status} ${body}`);
      }

      /** Renders `text` in the page and plays it into the page's own mix. */
      async function speak(text) {
        if (ON_PUSH) return speakOnMac(text);
        if (ENGINE === "kitten") return speakStreamed(text);
        state.spoken += 1;
        const startedAt = performance.now();
        let buffer;
        try {
          const render = { sam: renderSam, espeak: renderEspeak, tiny: renderTiny, kokoro: renderKokoro, kitten: renderKitten }[ENGINE];
          buffer = await render(text);
        } catch (error) {
          state.errors += 1;
          log(`${ENGINE} failed: ${error.message}`);
          return;
        }
        const renderMs = Math.round(performance.now() - startedAt);
        state.renderMs = renderMs;
        const source = context.createBufferSource();
        source.buffer = buffer;
        source.connect(voiceBus);
        source.onended = () => {
          state.finished += 1;
          log("speech ended");
        };
        source.start();
        log(`speech started (${buffer.duration.toFixed(1)} s, made in ${renderMs} ms): ${text}`);
      }

      document.getElementById("start").addEventListener("click", (event) => {
        event.currentTarget.disabled = true;
        // Safari's Audio Session API: "playback" is the category that is meant to keep going in the background.
        if (navigator.audioSession) {
          navigator.audioSession.type = "playback";
          log(`audio session type ${navigator.audioSession.type}`);
        } else log("no navigator.audioSession here");
        context = new AudioContext();
        context.addEventListener("statechange", () => log(`audio context ${context.state}`));
        noiseBus = context.createGain();
        noiseBus.gain.value = heardShare(mix.noise);
        noiseBus.connect(context.destination);
        voiceBus = context.createGain();
        voiceBus.gain.value = heardShare(mix.voice);
        voiceBus.connect(context.destination);
        playNoiseColor();
        log(`mix: agent ${mix.voice}, noise ${mix.noise} ${mix.color}`);
        void context.resume();
        if (WITH_DICTATION) startDictation();
        if (WITH_MIC && CONFIRM) startNowPlaying();
        if (WITH_MIC) void startMic().catch((error) => log(`mic failed: ${error.name} ${error.message}`));
        if (ON_PUSH) {
          void pingMac();
          // A timer, justified: the network's round trip is measured by timing one, and nothing announces it.
          setInterval(() => void pingMac(), 2000);
          void startVoicePlayer()
            .then(() => {
              void watchMac();
              return listenToMac();
            })
            .catch((error) => log(`push player failed: ${error.message}`));
        } else if (ENGINE === "kitten") {
          // Warm up: the first run of a model is slow, so pay it before any message, and discard it.
          chain = (ON_MAC ? loadEspeak() : loadKitten())
            .then(() => pronounce("Ready."))
            .then((phonemes) => renderKitten({ text: "Ready.", phonemes }))
            .then(() => log("warmed up"));
        }
        // Ready once the model has warmed up; until then a press would measure the loading.
        void chain.then(() => {
          document.getElementById("say").disabled = false;
          log("ready: press Say it");
        });
      });

      document.getElementById("confirm").addEventListener("click", () => confirmStop("the banner"));
      document.getElementById("replay").addEventListener("click", replayLast);
      document.getElementById("say").addEventListener("click", () => {
        const text = document.getElementById("text").value.trim();
        if (!text || !context) return;
        document.getElementById("latency").textContent = "…";
        speak(text);
      });

      // Polled once a second: what this reports is whether timers, the context and speech still run.
      const live = document.getElementById("live");
      const row = (name, value) => {
        const dt = document.createElement("dt");
        dt.textContent = name;
        const dd = document.createElement("dd");
        dd.textContent = value;
        live.append(dt, dd);
      };
      setInterval(() => {
        state.ticks += 1;
        live.replaceChildren();
        row("Audio context", context ? context.state : "-");
        row("Noise playing for", context ? `${context.currentTime.toFixed(1)} s` : "-");
        row("Lines asked / finished", `${state.spoken} / ${state.finished}`);
        row("Speech errors", String(state.errors));
        row("Mix", `agent ${mix.voice}, noise ${mix.noise} ${mix.color}${ON_PUSH ? `, speed ${speed.value.toFixed(2)}×` : ""}`);
        if (ON_PUSH) row("Mac stream", `${macStream.state} (connected ${macStream.connects}, dropped ${macStream.drops})`);
        if (WITH_MIC) {
          row("Mic", mic.track ? `${mic.track.readyState}${mic.track.muted ? ", muted" : ""}, peak ${Math.round(mic.peakDb)} dB, speech starts ${mic.speechStarts}` : "off");
        }
        row("Model runs on", ON_PUSH ? "the Mac, pushed" : ON_MAC ? "the Mac (resident Kitten)" : ON_GPU ? (navigator.gpu ? "GPU (WebGPU)" : "CPU (no WebGPU)") : "CPU");
        row("Voice", ENGINE === "kitten" ? `kitten ${KITTEN_VOICE}, first sound after ${state.renderMs ?? "-"} ms, gaps ${state.lastGapMs ?? "-"} ms` : `${ENGINE}, last line made in ${state.renderMs ?? "-"} ms`);
        if (!context) return;
        fetch("/api/audio/test-reports", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            kind: "local-test",
            page: id,
            visibility: document.visibilityState,
            context: context.state,
            contextTime: Number(context.currentTime.toFixed(1)),
            spoken: state.spoken,
            finished: state.finished,
            errors: state.errors,
            engine: ENGINE,
            renderMs: state.renderMs ?? null,
            gapMs: state.lastGapMs ?? null,
            onGpu: ON_GPU,
            onMac: ON_MAC,
            onPush: ON_PUSH,
            ...(WITH_MIC
              ? {
                  mic: {
                    state: mic.track ? `${mic.track.readyState}${mic.track.muted ? ", muted" : ""}` : "none",
                    peakDb: Math.round(mic.peakDb),
                    peakWhileAgentDb: Math.round(mic.peakWhileAgentDb),
                    peakQuietDb: Math.round(mic.peakQuietDb),
                    speechStarts: mic.speechStarts,
                  },
                }
              : {}),
            log: unsent.splice(0),
          }),
          keepalive: true,
        }).catch(() => {});
      }, 1000);
    </script>
  </body>
</html>
