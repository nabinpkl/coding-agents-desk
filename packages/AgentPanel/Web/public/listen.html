<!doctype html>
<!--
  Agent Radio: the audio channel on its own, installed to the Home Screen as a second app.

  A plain page in `public/`, which the dev server serves as it is, without its reload client: an
  edit to the panel, `index.html` included, reloads every panel page and must not stop this one.
  It loads one module from the panel's source (`listenPage.ts`). The panel's Profile menu links here.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Agent Radio" />
    <meta name="theme-color" content="#14161a" />
    <title>Agent Radio</title>
    <link rel="manifest" href="/listen.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/agent-radio-apple-touch.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/agent-radio.svg" />
    <style>
      :root {
        --ground: #f4f5f7;
        --ink: #14161a;
        --muted: #5b6270;
        --line: #d5d8de;
        --accent: #2f6fde;
        --accent-ink: #ffffff;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #14161a;
          --ink: #eceef2;
          --muted: #9aa1ad;
          --line: #2c3038;
          --accent: #6b9cf2;
          --accent-ink: #0d1117;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--ground);
        color: var(--ink);
        font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      }
      main {
        max-width: 420px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: -0.01em;
      }
      .status {
        margin: 0;
        min-height: 1.4em;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .controls {
        display: flex;
        gap: 12px;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: transparent;
        padding: 14px 18px;
        touch-action: manipulation;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      button:active {
        opacity: 0.8;
      }
      .primary {
        flex: 1;
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
        font-weight: 600;
      }
      .noise {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .noise input {
        flex: 1;
        min-width: 0;
        accent-color: var(--accent);
      }
      .noise output {
        width: 2.5em;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .colors {
        display: flex;
        gap: 8px;
      }
      .colors button {
        flex: 1;
        padding: 10px;
        text-transform: capitalize;
      }
      .colors button[aria-checked="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main id="radio">
      <h1>Agent Radio</h1>
      <noscript>Agent Radio needs JavaScript to play.</noscript>
    </main>
    <script type="module" src="/src/features/audio-channel/listenPage.ts"></script>
  </body>
</html>
