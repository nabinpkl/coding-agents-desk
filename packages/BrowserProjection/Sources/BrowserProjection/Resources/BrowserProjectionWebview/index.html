<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- ADR-0047 Phase 2: maximum-scale=4 (was 1) admits pinch-zoom so the desktop-captured mirror can be
     magnified for readability on the phone. WebKit's pinch is a visual-viewport transform: it does NOT
     reflow the page and does NOT change getBoundingClientRect, so the scale-aware tap/scroll mapping in
     surfaceMapping() stays correct while zoomed. It never scrolls the host either, so it is a pure view
     transform inside the pure-mirror invariant. -->
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=4" />
<title>AgentDesk Browser Projection</title>
<!-- rrweb's replayer-chrome stylesheet, vendored from rrweb@2.0.0-alpha.4 (same version as
     rrweb.min.js). rrweb's core adds .replayer-wrapper/.replayer-mouse/.replayer-mouse-tail
     classnames and sets the cursor's left/top inline, but ships their position:absolute in THIS
     file, not in the JS. Bundling it is required for the bare Replayer; without it the full-size
     mouse-tail canvas sat in normal flow and pushed the page down. -->
<link rel="stylesheet" href="rrweb.min.css" />
<style>
  :root {
    color-scheme: light dark;
    --chrome-bg: #e7e9ed;
    --chrome-raised: #f6f7f9;
    --chrome-selected: #ffffff;
    --chrome-border: #c8ccd3;
    --chrome-text: #202124;
    --chrome-muted: #686d76;
    --chrome-focus: #1473e6;
    --chrome-danger: #b42318;
    --content-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --chrome-bg: #25272b;
      --chrome-raised: #303238;
      --chrome-selected: #3b3e45;
      --chrome-border: #4a4d55;
      --chrome-text: #f1f3f4;
      --chrome-muted: #aeb2bb;
      --chrome-focus: #6da8ff;
      --chrome-danger: #ff8a80;
      --content-bg: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--content-bg); }
  body { font: 12px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; color: var(--chrome-text); }
  #browser-projection-root { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
  #browser-chrome { min-width: 0; background: var(--chrome-bg); border-bottom: 1px solid var(--chrome-border); }
  .strip { display: flex; align-items: end; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  #browser-projection-window-strip { min-height: 35px; padding: 5px 7px 0; gap: 4px; background: var(--chrome-bg); }
  #browser-projection-tab-strip { min-height: 34px; padding: 4px 7px 0; gap: 2px; background: var(--chrome-raised); border-top: 1px solid color-mix(in srgb, var(--chrome-border), transparent 45%); }
  .window-tab, .page-tab { appearance: none; border: 1px solid transparent; color: inherit; font: inherit; cursor: default; }
  .window-tab { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px; align-items: center; min-width: 150px; max-width: 240px; height: 30px; padding: 0 10px; border-radius: 7px 7px 0 0; background: color-mix(in srgb, var(--chrome-raised), transparent 28%); }
  .window-tab[aria-selected="true"] { background: var(--chrome-raised); border-color: var(--chrome-border); border-bottom-color: var(--chrome-raised); }
  .window-tab.is-focused::after { content: ""; position: absolute; top: 4px; right: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--chrome-focus); }
  .window-copy { min-width: 0; display: flex; flex-direction: column; text-align: left; }
  .window-label { font-weight: 600; }
  .window-title { color: var(--chrome-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; }
  .page-tab { display: flex; align-items: center; gap: 6px; min-width: 110px; max-width: 210px; height: 29px; padding: 0 9px; border-radius: 7px 7px 0 0; background: transparent; }
  .page-tab.pinned { min-width: 34px; width: 34px; padding: 0 8px; }
  .page-tab[aria-selected="true"] { background: var(--chrome-selected); border-color: var(--chrome-border); border-bottom-color: var(--chrome-selected); }
  .tab-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab-favicon { width: 16px; height: 16px; flex: none; object-fit: contain; }
  .tab-fallback { display: grid; place-items: center; width: 16px; height: 16px; flex: none; border-radius: 3px; background: var(--chrome-border); color: var(--chrome-text); font-size: 9px; font-weight: 700; }
  .tab-loading { width: 10px; height: 10px; flex: none; border: 1.5px solid var(--chrome-border); border-top-color: var(--chrome-focus); border-radius: 50%; animation: spin 800ms linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .group-chip { align-self: center; flex: none; padding: 3px 7px; border-radius: 9px; font-size: 10px; font-weight: 700; color: var(--group-color, var(--chrome-muted)); border: 1px solid currentColor; }
  #browser-toolbar { min-height: 38px; display: grid; grid-template-columns: auto auto minmax(120px, 1fr); align-items: center; gap: 8px; padding: 5px 8px; background: var(--chrome-selected); border-top: 1px solid var(--chrome-border); }
  .toolbar-buttons { display: flex; gap: 2px; }
  .toolbar-button { appearance: none; width: 27px; height: 27px; border: 0; border-radius: 50%; background: transparent; color: var(--chrome-muted); font: 15px/1 system-ui; }
  .toolbar-button:disabled { opacity: .6; }
  .readout { appearance: none; min-width: 0; margin: 0; padding: 0; border: 0; outline: 0; background: transparent; color: inherit; font: inherit; }
  #browser-projection-active-title { width: 230px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  #address-shell { min-width: 0; display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px; border-radius: 14px; background: var(--chrome-bg); }
  #security-indicator { color: var(--chrome-muted); }
  #browser-projection-address { width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: text; }
  #content-shell { min-height: 0; position: relative; background: var(--content-bg); }
  #browser-projection-content-status { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; padding: 24px; background: var(--content-bg); color: #5f6368; text-align: center; font-size: 13px; }
  #browser-projection-content-status[hidden] { display: none; }
  #stage { width: 100%; height: 100%; overflow: hidden; position: relative; background: #fff; }
  #replay-root { position: absolute; inset: 0; overflow: hidden; }
  /* Transparent overlay captures taps (the replayer iframe would otherwise swallow them). */
  #tap-overlay { position: absolute; inset: 0; z-index: 5; background: transparent; pointer-events: none; }
  body.page-active #tap-overlay { pointer-events: auto; }
  /* rrweb renders into an iframe inside .replayer-wrapper; fitReplay() sizes/scales it (ADR-0044).
     .replayer-wrapper's position:absolute-vs-relative etc. come from the vendored rrweb.min.css
     above; here we only add the scale origin. */
  #replay-root .replayer-wrapper { transform-origin: top left; }
  #stage iframe { border: 0; display: block; }
  #build-footer { display: flex; justify-content: flex-end; gap: 10px; min-height: 18px; padding: 2px 8px; border-top: 1px solid var(--chrome-border); background: var(--chrome-bg); color: var(--chrome-muted); font: 10px/1.3 ui-monospace, "SFMono-Regular", monospace; }
  #build-footer .readout { width: auto; field-sizing: content; }
  #build-footer[hidden] { display: none; }
  body.page-only #browser-chrome, body.page-only #build-footer { display: none; }
  body.page-only #browser-projection-root { grid-template-rows: minmax(0, 1fr); }
</style>
</head>
<body class="page-only">
  <div id="browser-projection-root">
    <div id="browser-chrome" hidden>
      <div id="browser-projection-window-strip" class="strip" role="tablist" aria-label="Chrome windows"></div>
      <div id="browser-projection-tab-strip" class="strip" role="tablist" aria-label="Tabs in projected Chrome window"></div>
      <div id="browser-toolbar">
        <div class="toolbar-buttons" aria-label="Read-only navigation controls">
          <button class="toolbar-button" disabled aria-label="Back">←</button>
          <button class="toolbar-button" disabled aria-label="Forward">→</button>
          <button class="toolbar-button" disabled aria-label="Reload">↻</button>
        </div>
        <input id="browser-projection-active-title" class="readout" readonly tabindex="-1" aria-label="Active tab title">
        <div id="address-shell"><span id="security-indicator">○</span><input id="browser-projection-address" class="readout" readonly tabindex="-1" aria-label="Address"></div>
      </div>
    </div>
    <div id="content-shell">
      <div id="browser-projection-content-status" role="status">Waiting for Chrome projection</div>
      <div id="stage"><div id="replay-root"></div><div id="tap-overlay"></div></div>
    </div>
    <div id="build-footer" hidden>
      <input id="browser-projection-focused-window" class="readout" readonly tabindex="-1" aria-label="Focused Chrome window">
      <input id="browser-projection-projected-window" class="readout" readonly tabindex="-1" aria-label="Projected Chrome window">
      <input id="browser-projection-generation" class="readout" readonly tabindex="-1" aria-label="Projection generation">
      <input id="browser-projection-page-marker" class="readout" readonly tabindex="-1" aria-label="Projected page marker">
      <input id="browser-projection-host-build" class="readout" readonly tabindex="-1" aria-label="Host build">
      <input id="browser-projection-extension-build" class="readout" readonly tabindex="-1" aria-label="Extension build">
    </div>
  </div>
  <script src="fflate.min.js"></script>
  <script src="rrweb.min.js"></script>
  <script>
  (function () {
    var FULL_SNAPSHOT = 2;
    var stage = document.getElementById('stage');
    var replayRoot = document.getElementById('replay-root');
    var chromeEl = document.getElementById('browser-chrome');
    var statusEl = document.getElementById('browser-projection-content-status');
    var browserState = null;
    var hostState = null;
    var replayer = null;
    var pending = [];
    // ADR-0043: chunk reassembly buffer, keyed by cid. A compressed batch too large for one line is
    // split into total parts; hold them until all arrive, then concat and inflate.
    var chunks = {};
    // ADR-0044 Tier B: CDP high-fidelity keyframes arrive as a self-contained masked HTML doc and
    // render into this overlay iframe (above the rrweb replayer, below the tap overlay). cdpSize is the
    // page CSS size for tap mapping.
    var cdpFrame = null;
    var cdpSize = null;
    var lastRecordedW = 0; // recorded desktop viewport width (meta.w) -> scale-to-fit basis
    var hasActiveProjection = false;

    function postIntent(message) {
      try { window.webkit.messageHandlers.domMirror.postMessage(message); } catch (e) {}
    }

    function setStatus(message) {
      statusEl.textContent = message || '';
      statusEl.hidden = !message;
    }

    function setReadout(id, value) {
      document.getElementById(id).value = value || '';
    }

    function clearProjection() {
      try { if (replayer) replayer.pause(); } catch (e) {}
      removeCdp();
      var wrapper = replayRoot.querySelector('.replayer-wrapper');
      if (wrapper) wrapper.remove();
      replayer = null;
      pending = [];
      chunks = {};
      adoptedCss = null;
      lastRecordedW = 0;
      fitScale = 1;
      hasActiveProjection = false;
      document.body.classList.remove('page-active');
    }

    function buildLabel(build) {
      if (!build) return 'extension unknown';
      var value = 'ext v' + (build.version || '?');
      if (build.commits != null) value += ' (' + build.commits + ')';
      if (build.sha) value += ' ' + build.sha;
      if (build.dirty) value += ' dirty';
      return value;
    }

    function currentWindow() {
      if (!browserState) return null;
      return browserState.windows.find(function (window) {
        return window.id === browserState.projectedWindowId;
      }) || null;
    }

    function currentTab(windowState) {
      if (!windowState) return null;
      return windowState.tabs.find(function (tab) { return tab.id === windowState.activeTabId; }) || null;
    }

    function favicon(tab) {
      if (tab.favIconDataURL && /^data:image\//.test(tab.favIconDataURL)) {
        var image = document.createElement('img');
        image.className = 'tab-favicon';
        image.alt = '';
        image.src = tab.favIconDataURL;
        return image;
      }
      var fallback = document.createElement('span');
      fallback.className = 'tab-fallback';
      fallback.textContent = (tab.title || tab.url || '?').trim().slice(0, 1).toUpperCase() || '?';
      return fallback;
    }

    function groupColor(name) {
      var colors = {
        grey: '#737780', blue: '#1a73e8', red: '#d93025', yellow: '#b06000',
        green: '#188038', pink: '#d01884', purple: '#8430ce', cyan: '#007b83', orange: '#c45100'
      };
      return colors[name] || colors.grey;
    }

    function renderWindows() {
      var strip = document.getElementById('browser-projection-window-strip');
      strip.replaceChildren();
      browserState.windows.forEach(function (windowState) {
        var active = currentTab(windowState);
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'window-tab' + (windowState.focused ? ' is-focused' : '');
        button.id = 'browser-projection-window-tab-' + windowState.id;
        button.setAttribute('role', 'tab');
        button.setAttribute('aria-selected', String(windowState.id === browserState.projectedWindowId));
        button.title = 'Window ' + windowState.ordinal + ': ' + ((active && active.title) || 'Untitled');
        var icon = document.createElement('span');
        icon.textContent = '▣';
        var copy = document.createElement('span');
        copy.className = 'window-copy';
        var label = document.createElement('span');
        label.className = 'window-label';
        label.textContent = 'Window ' + windowState.ordinal;
        var title = document.createElement('span');
        title.className = 'window-title';
        title.textContent = (active && (active.title || active.url)) || 'No selected tab';
        copy.append(label, title);
        button.append(icon, copy);
        button.addEventListener('click', function () {
          postIntent({ kind: 'select-window', windowId: windowState.id, generation: browserState.generation });
        });
        strip.appendChild(button);
      });
    }

    function renderTabs(windowState) {
      var strip = document.getElementById('browser-projection-tab-strip');
      strip.replaceChildren();
      if (!windowState) return;
      var groups = new Map(windowState.groups.map(function (group) { return [group.id, group]; }));
      var renderedGroups = new Set();
      windowState.tabs.slice().sort(function (a, b) { return a.index - b.index; }).forEach(function (tab) {
        var group = groups.get(tab.groupId);
        if (group && !renderedGroups.has(group.id)) {
          var chip = document.createElement('span');
          chip.className = 'group-chip';
          chip.textContent = group.title || 'Group';
          chip.title = group.collapsed ? 'Collapsed tab group' : 'Tab group';
          chip.style.setProperty('--group-color', groupColor(group.color));
          strip.appendChild(chip);
          renderedGroups.add(group.id);
        }
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'page-tab' + (tab.pinned ? ' pinned' : '');
        button.id = 'browser-projection-tab-' + windowState.id + '-' + tab.id;
        button.setAttribute('role', 'tab');
        button.setAttribute('aria-selected', String(tab.id === windowState.activeTabId));
        button.title = tab.title || tab.url || 'Untitled';
        button.appendChild(tab.status === 'loading' ? (function () {
          var loading = document.createElement('span'); loading.className = 'tab-loading'; return loading;
        })() : favicon(tab));
        if (!tab.pinned) {
          var title = document.createElement('span');
          title.className = 'tab-title';
          title.textContent = tab.title || tab.url || 'Untitled';
          button.appendChild(title);
        }
        if (tab.audible) {
          var audio = document.createElement('span');
          audio.textContent = tab.muted ? '⌁' : '♪';
          audio.setAttribute('aria-label', tab.muted ? 'Muted' : 'Playing audio');
          button.appendChild(audio);
        }
        button.addEventListener('click', function () {
          postIntent({
            kind: 'select-tab', windowId: windowState.id, tabId: tab.id,
            generation: browserState.generation
          });
        });
        strip.appendChild(button);
      });
    }

    function renderToolbar(tab) {
      setReadout('browser-projection-active-title', tab ? (tab.title || 'Untitled') : '');
      setReadout('browser-projection-address', tab ? (tab.url || '') : '');
      var security = document.getElementById('security-indicator');
      security.textContent = tab && /^https:/i.test(tab.url || '') ? '●' : '○';
      security.title = tab && /^https:/i.test(tab.url || '') ? 'Secure connection' : 'Connection information';
    }

    function renderContentState(tab) {
      document.body.classList.remove('page-active');
      if (!hostState || !hostState.connected) { setStatus('Chrome extension is disconnected'); return; }
      if (!browserState.windows.length) { setStatus('No normal Chrome windows'); return; }
      if (!tab) { setStatus('The projected window has no selected tab'); return; }
      if (tab.restricted) { setStatus('This Chrome page cannot be projected'); return; }
      if (tab.discarded) { setStatus('This tab is discarded in Chrome'); return; }
      if (tab.status === 'loading') { setStatus('Loading ' + (tab.title || tab.url || 'tab')); return; }
      if (hasActiveProjection) {
        document.body.classList.add('page-active');
        setStatus('');
        return;
      }
      setStatus('Waiting for the selected tab snapshot');
    }

    function renderBrowserState(nextState) {
      var priorGeneration = browserState && browserState.generation;
      var priorWindow = browserState && browserState.projectedWindowId;
      var priorWindowState = browserState && currentWindow();
      var priorTab = priorWindowState && priorWindowState.activeTabId;
      browserState = nextState;
      document.body.classList.remove('page-only');
      chromeEl.hidden = false;
      document.getElementById('build-footer').hidden = false;
      setReadout('browser-projection-extension-build', buildLabel(browserState.extension));
      setReadout('browser-projection-focused-window', 'focused ' + String(browserState.focusedWindowId == null ? 'none' : browserState.focusedWindowId));
      setReadout('browser-projection-projected-window', 'projected ' + String(browserState.projectedWindowId == null ? 'none' : browserState.projectedWindowId));
      setReadout('browser-projection-generation', 'generation ' + browserState.generation);
      var nextWindowState = currentWindow();
      if (priorGeneration !== browserState.generation
          || priorWindow !== browserState.projectedWindowId
          || priorTab !== (nextWindowState && nextWindowState.activeTabId)) {
        clearProjection();
        setReadout('browser-projection-page-marker', '');
      }
      var windowState = nextWindowState;
      var tab = currentTab(windowState);
      renderWindows();
      renderTabs(windowState);
      renderToolbar(tab);
      renderContentState(tab);
    }

    function renderHostState(nextState) {
      hostState = nextState;
      document.body.classList.remove('page-only');
      document.getElementById('build-footer').hidden = false;
      setReadout('browser-projection-host-build', 'host ' + (nextState.sha || 'unknown'));
      if (!nextState.connected) setStatus('Chrome extension is disconnected');
      else if (browserState) renderContentState(currentTab(currentWindow()));
      else setStatus('Waiting for Chrome browser state');
    }

    function base64ToBytes(b64) {
      var bin = atob(b64);
      var out = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    // ADR-0043: events ship deflate-compressed + base64 (see worker.js). Inflate here, at the sink;
    // the host and Swift client relay the string opaquely.
    function inflateEvents(b64) {
      return JSON.parse(fflate.strFromU8(fflate.unzlibSync(base64ToBytes(b64))));
    }
    function inflateStr(b64) {
      return fflate.strFromU8(fflate.unzlibSync(base64ToBytes(b64)));
    }

    // ADR-0043 chunk reassembly, shared by the events and CDP paths. Returns the full base64 string,
    // or null while still waiting for parts. Keyed by cid; parts placed by seq so a dup/reorder on the
    // (reliable, ordered) .dom lane still can't corrupt the concatenation.
    function reassemble(batch) {
      var b64 = batch.ev || '';
      if (batch.total > 1) {
        var slot = chunks[batch.cid] || (chunks[batch.cid] = { total: batch.total, parts: [], count: 0 });
        if (slot.parts[batch.seq] === undefined) { slot.parts[batch.seq] = b64; slot.count++; }
        if (slot.count < slot.total) return null;
        delete chunks[batch.cid];
        b64 = slot.parts.join('');
      }
      return b64;
    }

    // ADR-0044 Tier A: adopted-stylesheet CSS the isolated recorder read and shipped (see
    // content-isolated.js / worker.js). rrweb rebuilds the replay iframe on each FullSnapshot, wiping
    // anything we injected, so keep the latest CSS and re-inject after every snapshot into a singleton
    // <style id="agentdesk-adopted">.
    var adoptedCss = null;
    function injectAdoptedCss() {
      if (adoptedCss == null || !replayer || !replayer.iframe || !replayer.iframe.contentDocument) return;
      var doc = replayer.iframe.contentDocument;
      var el = doc.getElementById('agentdesk-adopted');
      if (!el) {
        el = doc.createElement('style');
        el.id = 'agentdesk-adopted';
        (doc.head || doc.documentElement).appendChild(el);
      }
      if (el.textContent !== adoptedCss) el.textContent = adoptedCss;
    }

    // ADR-0044 Tier B: render/replace the CDP snapshot. Overlays the rrweb replayer (which keeps
    // running underneath, harmless); the tap overlay stays on top. w/h size the frame for tap mapping.
    function renderCdp(html, w, h) {
      if (!cdpFrame) {
        cdpFrame = document.createElement('iframe');
        cdpFrame.id = 'cdp-frame';
        cdpFrame.setAttribute('sandbox', ''); // no scripts: it's a static, masked snapshot
        cdpFrame.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;z-index:2;';
        replayRoot.appendChild(cdpFrame);
      }
      cdpSize = { w: w || 0, h: h || 0 };
      // The CDP frame is sandbox='' (opaque origin) so we can't measure/reflow it; scale-to-fit by the
      // known recorded width instead. Tap mapping uses cdpSize.w against the displayed (scaled) rect.
      var stageW = stage.clientWidth || 1;
      if (w && w > stageW) {
        cdpFrame.style.width = w + 'px';
        cdpFrame.style.height = (h || stage.clientHeight) + 'px';
        cdpFrame.style.transformOrigin = 'top left';
        cdpFrame.style.transform = 'scale(' + (stageW / w) + ')';
      } else {
        cdpFrame.style.width = '100%';
        cdpFrame.style.height = '100%';
        cdpFrame.style.transform = 'none';
      }
      cdpFrame.srcdoc = html;
    }
    function removeCdp() {
      if (cdpFrame) { cdpFrame.remove(); cdpFrame = null; }
      cdpSize = null;
    }

    function haveSnapshot(evts) {
      for (var i = 0; i < evts.length; i++) if (evts[i].type === FULL_SNAPSHOT) return true;
      return false;
    }

    function applyEvent(e) {
      if (!replayer) {
        pending.push(e);
        if (haveSnapshot(pending)) {
          // mouseTail on (rrweb default): the recorded cursor (.replayer-mouse) and its move-trail
          // (.replayer-mouse-tail) now draw as absolute overlays, positioned by the vendored
          // rrweb.min.css, so they no longer take flow space or push the page.
          replayer = new rrweb.Replayer(pending, { liveMode: true, root: replayRoot });
          replayer.startLive(pending[0].timestamp);
          pending = [];
        }
      } else {
        replayer.addEvent(e);
      }
    }

    // ADR-0044: fit the desktop-captured page to the phone. rrweb does NOT reflow -- it replays the
    // page faithfully at the RECORDED desktop width (meta.w, the Mac viewport), so the only lever is a
    // transform scale (this is what rrweb-player does too). Scale the whole page down to the phone
    // width: exact desktop layout, whole width visible, text smaller (pinch-zoom is a future add).
    // Tap-back (ADR-0040) stays exact because getBoundingClientRect reflects the scaled rect.
    var fitScale = 1;
    function fitReplay() {
      if (!replayer || !replayer.iframe) return;
      var iframe = replayer.iframe;
      var wrapper = iframe.parentNode;
      if (!wrapper) return;
      var doc = iframe.contentDocument;
      var recordedW = lastRecordedW
        || parseInt(iframe.getAttribute('width'), 10)
        || (doc && doc.documentElement && doc.documentElement.scrollWidth)
        || 0;
      if (!recordedW) return;
      var stageW = stage.clientWidth || 1;
      fitScale = Math.min(1, stageW / recordedW);
      wrapper.style.transformOrigin = 'top left';
      wrapper.style.transform = 'scale(' + fitScale + ')';
    }

    // Native -> webview: one batch { t, tb, co, ev:[...], meta }. Feed its rrweb events, then
    // report a probe summary of the reconstructed DOM so the autonomous harness can assert the
    // mirror worked (visible text is masked, so the probe keys on a data-attribute marker +
    // node count, not on page text).
    window.__browserProjectionDeliver = function (rawJSON) {
      var batch;
      try { batch = typeof rawJSON === 'string' ? JSON.parse(rawJSON) : rawJSON; }
      catch (e) { return; }
      if (!batch) return;
      if (batch.t === 'projection-host') { renderHostState(batch); return; }
      if (batch.t === 'browser-state') { renderBrowserState(batch); return; }
      if (batch.t !== 'dom-batch') return;
      var projected = browserState && currentWindow();
      if (browserState && (!projected || batch.g !== browserState.generation || batch.tb !== projected.activeTabId)) return;
      if (batch.meta && batch.meta.w) lastRecordedW = batch.meta.w; // recorded desktop width for fit
      // ADR-0043/0044: a keyframe (co:true) supersedes any incomplete chunk set, for events AND CDP.
      // Clearing here bounds the chunks map (no slot outlives the next keyframe) and makes a cid reused
      // after an MV3 service-worker restart harmless (part 0's co:true clears the old slot first).
      if (batch.co) chunks = {};
      // ADR-0044 Tier B: CDP high-fidelity keyframe (self-contained masked HTML) or a turn-off signal.
      if (batch.k === 'cdp') {
        if (batch.enc !== 'deflate-b64') return;
        var cb64 = reassemble(batch);
        if (cb64 == null) return;
        var chtml;
        try { chtml = inflateStr(cb64); } catch (e) { return; }
        renderCdp(chtml, batch.w, batch.h);
        hasActiveProjection = true;
        if (browserState) renderContentState(currentTab(currentWindow()));
        else { document.body.classList.add('page-active'); setStatus(''); }
        scheduleProbe();
        return;
      }
      if (batch.k === 'cdp-off') { removeCdp(); return; }
      // ADR-0044 Tier A: a css-only line carries adopted-stylesheet CSS (no events). Stash + inject.
      if (batch.cssz) {
        try { adoptedCss = inflateStr(batch.cssz); injectAdoptedCss(); } catch (e) {}
        return;
      }
      var ev;
      if (batch.enc === 'deflate-b64') {
        var b64 = reassemble(batch);
        if (b64 == null) return; // waiting for the remaining parts
        try { ev = inflateEvents(b64); }
        catch (e) { return; } // corrupt/partial batch: drop it, the next keyframe recovers
      } else {
        // Defensive: an uncompressed batch (array ev) still replays.
        ev = (batch && batch.ev) || [];
      }
      for (var i = 0; i < ev.length; i++) applyEvent(ev[i]);
      injectAdoptedCss(); // re-apply after a (possibly rebuilt) snapshot
      if (replayer) {
        hasActiveProjection = true;
        if (browserState) renderContentState(currentTab(currentWindow()));
        else { document.body.classList.add('page-active'); setStatus(''); }
      }
      scheduleProbe();
    };

    // rrweb liveMode renders the FullSnapshot on a timed tick, not synchronously, so probing right
    // after addEvent would read an unrendered (empty) iframe. Debounce: probe ~700ms after the last
    // batch, by which point the replayer has reconstructed the DOM.
    var probeTimer = null;
    function scheduleProbe() {
      if (probeTimer) clearTimeout(probeTimer);
      probeTimer = setTimeout(postProbe, 700);
    }

    function postProbe() {
      // In CDP mode probe the overlay frame; otherwise the rrweb replayer iframe.
      var doc = null;
      if (cdpFrame && cdpFrame.contentDocument) doc = cdpFrame.contentDocument;
      else if (replayer && replayer.iframe && replayer.iframe.contentDocument) doc = replayer.iframe.contentDocument;
      if (!doc) return;
      injectAdoptedCss(); // the snapshot rebuild is async; ensure the style survives the settled DOM
      fitReplay();        // fit the (now settled) page to the phone: reflow, else scale
      var markerEl = doc.querySelector('[data-agentdesk-fixture]');
      var marker = markerEl ? markerEl.getAttribute('data-agentdesk-fixture') : '';
      var nodes = doc.querySelectorAll('*').length;
      setReadout('browser-projection-page-marker', 'marker ' + marker);
      try {
        window.webkit.messageHandlers.domMirror.postMessage({ kind: 'probe', marker: marker, nodes: nodes });
      } catch (e) {}
    }

    // Shared page-space mapping for both tap and scroll: the displayed (scaled) surface rect plus the
    // per-axis scale (page CSS px per display px). Keys off whichever surface is showing (the CDP
    // overlay or the rrweb iframe), exactly like the tap handler, so it stays correct under fitReplay
    // scale and (Phase 2) under visual-viewport zoom, which does not change getBoundingClientRect().
    function surfaceMapping() {
      var frame = cdpFrame || (replayer && replayer.iframe);
      if (!frame) return null;
      var rect = frame.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return null;
      var pageW = (cdpFrame && cdpSize && cdpSize.w) || parseInt(frame.getAttribute('width'), 10) || rect.width;
      var pageH = (cdpFrame && cdpSize && cdpSize.h) || parseInt(frame.getAttribute('height'), 10) || rect.height;
      return { rect: rect, sx: pageW / rect.width, sy: pageH / rect.height, pageW: pageW, pageH: pageH };
    }

    // ADR-0047 scroll-drive-back: a single-finger drag on the overlay drives the REAL host tab to
    // scroll (so lazy/infinite/scroll-JS pages work, because it is always the live page). We map the
    // finger movement from the displayed mirror into the page's own CSS-px space with surfaceMapping()
    // (the same math the tap uses), accumulate dx/dy across the gesture, coalesce to animation frames,
    // and post one scroll message per frame. Sign convention: dx/dy are the FINGER movement in page px
    // (positive dy = finger moved down); the extension feeds them straight to the CDP scroll gesture so
    // the content follows the finger.
    // A drag past MOVE_THRESHOLD display px sets `moved`, so the click handler below suppresses the
    // synthetic tap that would otherwise fire at touchend. Multi-touch (Phase 2 pinch) is not a scroll.
    var MOVE_THRESHOLD = 8;
    var scrollG = { active: false, lastX: 0, lastY: 0, accX: 0, accY: 0, disp: 0, anchorX: 0, anchorY: 0, moved: false, raf: 0 };
    var overlay = document.getElementById('tap-overlay');

    function flushScroll() {
      scrollG.raf = 0;
      // Only a gesture that crossed MOVE_THRESHOLD reaches the wire; this also stops the touchend
      // flush from leaking a few px of sub-threshold jitter (which would nudge the live host page).
      if (!scrollG.moved || (scrollG.accX === 0 && scrollG.accY === 0)) return;
      var dx = scrollG.accX, dy = scrollG.accY;
      scrollG.accX = 0; scrollG.accY = 0;
      try {
        window.webkit.messageHandlers.domMirror.postMessage({
          kind: 'scroll', x: scrollG.anchorX, y: scrollG.anchorY, dx: dx, dy: dy });
      } catch (e) {}
    }

    overlay.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) { scrollG.active = false; return; } // pinch/multi-touch: not a scroll
      var m = surfaceMapping();
      if (!m) return;
      var t = e.touches[0];
      scrollG.active = true; scrollG.moved = false; scrollG.disp = 0;
      scrollG.lastX = t.clientX; scrollG.lastY = t.clientY;
      scrollG.accX = 0; scrollG.accY = 0;
      scrollG.anchorX = (t.clientX - m.rect.left) * m.sx;
      scrollG.anchorY = (t.clientY - m.rect.top) * m.sy;
    }, { passive: true });

    overlay.addEventListener('touchmove', function (e) {
      if (!scrollG.active) return;
      if (e.touches.length !== 1) { scrollG.active = false; return; }
      var m = surfaceMapping();
      if (!m) return;
      var t = e.touches[0];
      var dxDisp = t.clientX - scrollG.lastX, dyDisp = t.clientY - scrollG.lastY;
      scrollG.lastX = t.clientX; scrollG.lastY = t.clientY;
      scrollG.accX += dxDisp * m.sx; // finger delta -> page px
      scrollG.accY += dyDisp * m.sy;
      scrollG.disp += Math.abs(dxDisp) + Math.abs(dyDisp);
      // Deadzone: until the finger travels past MOVE_THRESHOLD display px, treat it as a (possibly
      // jittery) tap -- accumulate but post NOTHING, so a tap never nudges the live host page. Once
      // crossed, the gesture is a scroll for good: `moved` also suppresses the trailing synthetic tap,
      // and the accumulated delta (including the threshold travel) flushes on the next frame.
      if (!scrollG.moved) {
        if (scrollG.disp <= MOVE_THRESHOLD) return;
        scrollG.moved = true;
      }
      if (!scrollG.raf) scrollG.raf = requestAnimationFrame(flushScroll);
    }, { passive: true });

    function endScroll() {
      if (!scrollG.active) return;
      scrollG.active = false;
      if (scrollG.raf) { cancelAnimationFrame(scrollG.raf); scrollG.raf = 0; }
      flushScroll();
    }
    overlay.addEventListener('touchend', endScroll, { passive: true });
    overlay.addEventListener('touchcancel', endScroll, { passive: true });

    // ADR-0040: capture a tap on the overlay, map it from the displayed (scaled) mirror back to the
    // page's own CSS-pixel coordinate space, and post it to native to route back to Chrome. rrweb
    // sets the replayer iframe's width/height attributes to the recorded page size, so the scale is
    // recordedSize / displayedSize.
    document.getElementById('tap-overlay').addEventListener('click', function (e) {
      // ADR-0047: a drag past the threshold already drove a scroll; swallow the synthetic click it
      // produced at touchend so a scroll never also fires a tap. Reset for the next gesture.
      if (scrollG.moved) { scrollG.moved = false; return; }
      // Map against whichever surface is showing (CDP overlay or rrweb iframe) via the shared mapping.
      var m = surfaceMapping();
      if (!m) return;
      var x = (e.clientX - m.rect.left) * m.sx;
      var y = (e.clientY - m.rect.top) * m.sy;
      if (x < 0 || y < 0 || x > m.pageW || y > m.pageH) return; // tap landed outside the mirrored page
      try { window.webkit.messageHandlers.domMirror.postMessage({ kind: 'tap', x: x, y: y }); } catch (err) {}
    });

    // Re-fit on viewport change (orientation / split view).
    window.addEventListener('resize', function () { try { fitReplay(); } catch (e) {} });

    window.__browserProjectionBridge = { destroy: function () { try { clearProjection(); } catch (e) {} } };
  })();
  </script>
</body>
</html>
