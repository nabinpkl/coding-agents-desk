<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'">
    <title>xterm.js WKWebView spike</title>
    <link rel="stylesheet" href="app.css">
  </head>
  <body>
    <main class="spike">
      <nav class="tab-strip" role="tablist" aria-label="Spike terminal tabs">
        <button class="terminal-tab" data-terminal-tab="tab-a" role="tab" aria-selected="true">
          <span class="tab-index">1</span><span class="tab-title">Terminal A</span>
        </button>
        <button class="terminal-tab" data-terminal-tab="tab-b" role="tab" aria-selected="false">
          <span class="tab-index">2</span><span class="tab-title">Terminal B</span>
        </button>
      </nav>
      <section class="terminal-stage">
        <article class="terminal-pane" data-terminal-pane="tab-a" role="tabpanel">
          <div class="terminal-mount"></div>
          <footer class="terminal-footer">
            <span class="terminal-status">Waiting for native bridge…</span>
            <span class="terminal-owner">Source frozen</span>
            <span class="terminal-source">Source --×--</span>
            <span class="terminal-view">View --×--</span>
            <span class="terminal-renderer">Renderer loading</span>
          </footer>
        </article>
        <article class="terminal-pane" data-terminal-pane="tab-b" role="tabpanel" hidden>
          <div class="terminal-mount"></div>
          <footer class="terminal-footer">
            <span class="terminal-status">Waiting for native bridge…</span>
            <span class="terminal-owner">Source frozen</span>
            <span class="terminal-source">Source --×--</span>
            <span class="terminal-view">View --×--</span>
            <span class="terminal-renderer">Renderer loading</span>
          </footer>
        </article>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
