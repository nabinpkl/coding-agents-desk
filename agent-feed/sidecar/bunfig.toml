# The Agent SDK ships one release per Claude Code CLI release, usually the same minute, and the
# runner drives the installed CLI. The owner's global 48-hour minimumReleaseAge would hold the SDK
# a day or two behind the CLI it talks to, so it alone is exempt (ADR-0143). Its platform packages
# carry the bundled CLI binary and release with it; bun resolves every one of them for the
# lockfile whatever this machine is, so all are listed.
[install]
minimumReleaseAgeExcludes = [
  "@anthropic-ai/claude-agent-sdk",
  "@anthropic-ai/claude-agent-sdk-darwin-arm64",
  "@anthropic-ai/claude-agent-sdk-darwin-x64",
  "@anthropic-ai/claude-agent-sdk-linux-arm64",
  "@anthropic-ai/claude-agent-sdk-linux-arm64-musl",
  "@anthropic-ai/claude-agent-sdk-linux-x64",
  "@anthropic-ai/claude-agent-sdk-linux-x64-musl",
  "@anthropic-ai/claude-agent-sdk-win32-arm64",
  "@anthropic-ai/claude-agent-sdk-win32-x64",
]
