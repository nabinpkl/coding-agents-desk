# The speech process (`speech_server.py`): Phonon 31M on this Mac's GPU, through Gradium's `ptts`
# runtime. Its own small environment, built with `uv sync` here, so it carries nothing it does not run.
[project]
name = "agentdesk-speech"
version = "0.1.0"
description = "Text to speech on the Mac for AgentDesk's audio channel."
requires-python = ">=3.13"
dependencies = [
    "numpy==2.4.6",
    # Phonon's runtime (Rust, with Metal), whose only dependency is numpy.
    "ptts==0.4.0",
]

[tool.uv]
package = false
